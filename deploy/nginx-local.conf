# Tort markazi sayti — lokal nginx proxy.
# O'rnatish:  sudo bash deploy/install-nginx.sh
# Keyin sayt: http://localhost
#
# Diqqat: Django loyiha papkasida apostrof (') bor — yo'llar qo'shtirnoq
# ichida yozilishi shart.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost 127.0.0.1 10.47.47.168;

    charset utf-8;
    client_max_body_size 8m;

    # Rasm va fayllarni Django'ga yubormasdan to'g'ridan-to'g'ri beramiz
    location /static/ {
        alias "/home/ubuntu/Desktop/loyihalarim/Semurog' tort markazi/static/";
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias "/home/ubuntu/Desktop/loyihalarim/Semurog' tort markazi/media/";
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Qolgan hammasi Django'ga (8001-port)
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
