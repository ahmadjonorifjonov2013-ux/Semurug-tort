{% extends 'base.html' %}

{% block title %}Parolni o'zgartirish — {{ settings_obj.site_name|default:"Semurg' TORT Markazi" }}{% endblock %}

{% block content %}
<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        <div class="form-card">
          <h1 class="h4 mb-3">Parolni o'zgartirish</h1>
          <form method="post" novalidate>
            {% csrf_token %}
            {% include 'includes/form_fields.html' %}
            <button type="submit" class="btn btn-danger w-100 py-2">
              <i class="bi bi-shield-lock"></i> Parolni yangilash
            </button>
          </form>
        </div>
        <p class="text-center mt-3 mb-0 small">
          <a href="{% url 'clients:profile' %}"><i class="bi bi-arrow-left me-1"></i>Profilga qaytish</a>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
